    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .flame { animation: flame 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .flame.b { animation-duration: 1.2s; animation-delay: -0.4s; }
      .flame.c { animation-duration: 0.7s; animation-delay: -0.2s; }
      @keyframes flame { from { transform: scale(0.9, 0.85); opacity: 0.85; } to { transform: scale(1.05, 1.12); opacity: 1; } }
      .ley { animation: ley 2.8s ease-in-out infinite alternate; }
      .glow { animation: glow 1.6s ease-in-out infinite alternate; }
      @keyframes ley { from { opacity: 0.55; } to { opacity: 1; } }
      @keyframes glow { from { opacity: 0.6; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
