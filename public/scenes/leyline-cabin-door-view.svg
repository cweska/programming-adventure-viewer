<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Gearshift leaning on the wall beside the cabin door and Master Oogrish at the window, seen from Mar'tu's seat">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#5a3a22"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4528"/>
      <stop offset="1" stop-color="#8a5a32"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160c32"/>
      <stop offset="1" stop-color="#4a2c6a"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.2" cy="0.6" r="0.9">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9aa8"/>
      <stop offset="1" stop-color="#b8c4d0"/>
    </linearGradient>
    <style>
      .twinkle { animation: twinkle 3.4s ease-in-out infinite alternate; }
      .visor { animation: visor 4s ease-in-out infinite alternate; }
      @keyframes twinkle { from { opacity: 0.35; } to { opacity: 1; } }
      @keyframes visor { from { opacity: 0.7; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .twinkle, .visor { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#wall)"/>
  <g stroke="#2a190d" stroke-width="3" opacity="0.55">
    <path d="M0 50 H960 M0 100 H960 M0 150 H960 M0 200 H960 M0 250 H960 M0 300 H960 M0 350 H960"/>
  </g>
  <path d="M0 370 H960 V540 H0 Z" fill="url(#floor)"/>
