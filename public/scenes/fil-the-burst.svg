<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A towering wave of blue-white light rolling across the night hills, with a tiny cabin under a violet dome in the distance">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0822"/>
      <stop offset="0.6" stop-color="#2a1a4c"/>
      <stop offset="1" stop-color="#3e2a5c"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3b4f"/><stop offset="1" stop-color="#1c2836"/></linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25453a"/><stop offset="1" stop-color="#16291f"/></linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a24"/><stop offset="1" stop-color="#0d1a10"/></linearGradient>
    <radialGradient id="fly" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbffb0"/>
      <stop offset="0.4" stop-color="#e6f56a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e6f56a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070c" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#05070c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#05070c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe4ff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f8ff"/>
    </linearGradient>
    <linearGradient id="waveBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6fd1" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#5fb8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#bfeeff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .wave { animation: wave 14.0s linear infinite; }
      @keyframes wave {
        0% { transform: translateX(0.0px); opacity: 1; }
        90% { transform: translateX(810.0px); opacity: 1; }
        96% { opacity: 0; }
        100% { transform: translateX(900.0px); opacity: 0; }
      }
      .spark { animation: spark 2.4s ease-out infinite; }
      .spark.s1 { animation-delay: -0.8s; }
      .spark.s2 { animation-delay: -1.6s; }
      @keyframes spark { from { transform: translateY(0); opacity: 0.9; } to { transform: translateY(-60px); opacity: 0; } }
      .dome { animation: dome 2s ease-in-out infinite alternate; }
      @keyframes dome { from { opacity: 0.22; } to { opacity: 0.4; } }
      .f0 { animation: f0 14.0s linear infinite; }
      @keyframes f0 { 0%, 8.9% { opacity: 1; } 10.9%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f1 { animation: f1 14.0s linear infinite; }
      @keyframes f1 { 0%, 18.9% { opacity: 1; } 20.9%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f2 { animation: f2 14.0s linear infinite; }
      @keyframes f2 { 0%, 26.7% { opacity: 1; } 28.7%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f3 { animation: f3 14.0s linear infinite; }
      @keyframes f3 { 0%, 35.6% { opacity: 1; } 37.6%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f4 { animation: f4 14.0s linear infinite; }
      @keyframes f4 { 0%, 43.3% { opacity: 1; } 45.3%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f5 { animation: f5 14.0s linear infinite; }
      @keyframes f5 { 0%, 51.1% { opacity: 1; } 53.1%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f6 { animation: f6 14.0s linear infinite; }
      @keyframes f6 { 0%, 57.8% { opacity: 1; } 59.8%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f7 { animation: f7 14.0s linear infinite; }
      @keyframes f7 { 0%, 64.4% { opacity: 1; } 66.4%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f8 { animation: f8 14.0s linear infinite; }
      @keyframes f8 { 0%, 71.1% { opacity: 1; } 73.1%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f9 { animation: f9 14.0s linear infinite; }
      @keyframes f9 { 0%, 77.8% { opacity: 1; } 79.8%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f10 { animation: f10 14.0s linear infinite; }
      @keyframes f10 { 0%, 12.2% { opacity: 1; } 14.2%, 94% { opacity: 0; } 100% { opacity: 1; } }
      .f11 { animation: f11 14.0s linear infinite; }
      @keyframes f11 { 0%, 31.1% { opacity: 1; } 33.1%, 94% { opacity: 0; } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .wave, .spark, .dome, .ff { animation: none; }
        .ff.behind { opacity: 0; }
      }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <g fill="#fdf6ff">
    <circle cx="80" cy="60" r="1.8"/><circle cx="240" cy="40" r="2.2"/><circle cx="410" cy="80" r="1.8"/>
    <circle cx="600" cy="60" r="1.1"/><circle cx="880" cy="60" r="2"/><circle cx="920" cy="170" r="1.3"/>
  </g>
  <circle cx="760" cy="120" r="54" fill="#b8f5a0" opacity="0.85"/>
  <path d="M0 330 C 140 270, 260 290, 380 310 S 640 260, 760 290 S 900 300, 960 280 L 960 540 L 0 540 Z" fill="url(#hillFar)"/>
  <g>
    <path d="M790 352 a 70 60 0 0 1 140 0 Z" fill="#a874ff" opacity="0.34" stroke="#e2ccff" stroke-width="3" class="dome"/>
    <rect x="838" y="328" width="34" height="22" fill="#3a2416"/>
    <path d="M832 330 L 855 312 L 878 330 Z" fill="#5a2a18"/>
    <rect x="850" y="336" width="8" height="8" fill="#ffcf6b"/>
  </g>
  <path d="M0 380 C 120 340, 230 350, 340 372 S 560 400, 700 352 S 880 330, 960 350 L 960 540 L 0 540 Z" fill="url(#hillMid)"/>
  <path d="M0 440 C 150 400, 310 420, 460 446 S 760 470, 960 420 L 960 540 L 0 540 Z" fill="url(#hillNear)"/>
  <g>
    <circle class="ff f0 behind" cx="80" cy="410" r="8" fill="url(#fly)"/>
    <circle class="ff f1 behind" cx="170" cy="470" r="8" fill="url(#fly)"/>
    <circle class="ff f2 behind" cx="240" cy="380" r="8" fill="url(#fly)"/>
    <circle class="ff f3 behind" cx="320" cy="450" r="8" fill="url(#fly)"/>
    <circle class="ff f4 behind" cx="390" cy="400" r="8" fill="url(#fly)"/>
    <circle class="ff f5" cx="460" cy="480" r="8" fill="url(#fly)"/>
    <circle class="ff f6" cx="520" cy="380" r="8" fill="url(#fly)"/>
    <circle class="ff f7" cx="580" cy="440" r="8" fill="url(#fly)"/>
    <circle class="ff f8" cx="640" cy="400" r="8" fill="url(#fly)"/>
    <circle class="ff f9" cx="700" cy="470" r="8" fill="url(#fly)"/>
    <circle class="ff f10 behind" cx="110" cy="500" r="8" fill="url(#fly)"/>
    <circle class="ff f11 behind" cx="280" cy="500" r="8" fill="url(#fly)"/>
  </g>
  <g class="wave" transform="translate(430.0 0)">
    <rect x="-1400" y="250" width="1330" height="290" fill="url(#shade)"/>
    <g>
      <circle class="spark s0" cx="-80" cy="470" r="2" fill="#cfefff"/>
      <circle class="spark s1" cx="-160" cy="420" r="1.6" fill="#cfefff"/>
      <circle class="spark s2" cx="-240" cy="490" r="2.2" fill="#cfefff"/>
      <circle class="spark s0" cx="-320" cy="440" r="1.5" fill="#cfefff"/>
      <circle class="spark s1" cx="-420" cy="470" r="2" fill="#cfefff"/>
      <circle class="spark s2" cx="-520" cy="430" r="1.8" fill="#cfefff"/>
      <circle class="spark s0" cx="-620" cy="480" r="2" fill="#cfefff"/>
    </g>
    <path d="M40 540 C 30 420, 10 300, -20 200 C -40 140, -20 80, 40 60 C 80 50, 110 80, 100 110 C 90 90, 60 90, 50 110 C 40 140, 70 220, 70 320 C 70 420, 60 480, 60 540 Z" fill="url(#crest)" filter="url(#bloom)"/>
    <path d="M-280 540 C -260 420, -220 260, -120 160 C -60 100, 0 70, 40 60 C 0 120, -10 220, 10 320 C 24 420, 40 480, 40 540 Z" fill="url(#waveBody)" opacity="0.9"/>
    <path d="M-10 200 C -20 260, -4 340, 20 420" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>
