    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.5" stop-color="#c9d0d8"/>
      <stop offset="1" stop-color="#8e98a4"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8602c"/>
      <stop offset="1" stop-color="#8a4420"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c5560"/>
