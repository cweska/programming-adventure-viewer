      <stop offset="1" stop-color="#d0201a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e3d22"/>
