    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#1d4a63"/>
    </linearGradient>
    <radialGradient id="holeGlow" cx="0.5" cy="0.75" r="0.6">
