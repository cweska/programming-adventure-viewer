      <stop offset="0.6" stop-color="#6cc8f0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6cc8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bfeeff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#8fd8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .knock { opacity: 0; animation: knock 4.2s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .knock.k2 { animation-delay: 0.3s; }
      .knock.k3 { animation-delay: 0.6s; }
      @keyframes knock {
        0% { opacity: 0; transform: scale(0.5); }
        4% { opacity: 1; transform: scale(1.15); }
        8% { opacity: 1; transform: scale(1); }
        80% { opacity: 0; transform: scale(1); }
        100% { opacity: 0; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) { .knock { animation: none; opacity: 1; } }
    </style>
