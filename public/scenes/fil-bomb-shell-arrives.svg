<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Bomb Shell pulling himself up through the open trap door, his teal optic glowing, with Lucky&#x27;s shaggy head and platinum armor behind him">
