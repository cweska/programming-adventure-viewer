<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Grassy hills at night under a purple sky, with fireflies, stars, and a large green moon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140b2e"/>
      <stop offset="0.55" stop-color="#3a1f5c"/>
      <stop offset="1" stop-color="#5b3a6e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8f5a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8f5a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#e3ffcf"/>
      <stop offset="0.6" stop-color="#9ee07f"/>
      <stop offset="1" stop-color="#5fa65a"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3b4f"/>
      <stop offset="1" stop-color="#1c2836"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25453a"/>
      <stop offset="1" stop-color="#16291f"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a24"/>
      <stop offset="1" stop-color="#0d1a10"/>
    </linearGradient>
    <radialGradient id="fly" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbffb0"/>
      <stop offset="0.4" stop-color="#e6f56a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e6f56a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .twinkle { animation: twinkle 3.6s ease-in-out infinite alternate; }
      .twinkle.b { animation-delay: -1.2s; }
      .twinkle.c { animation-delay: -2.4s; }
      .drift { animation: drift 6s ease-in-out infinite alternate; }
      .drift.b { animation-duration: 7.5s; animation-delay: -2s; }
      .drift.c { animation-duration: 5.2s; animation-delay: -4s; }
      @keyframes twinkle { from { opacity: 0.35; } to { opacity: 1; } }
      @keyframes drift { from { transform: translate(0, 0); opacity: 0.5; } to { transform: translate(10px, -12px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .twinkle, .drift { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <g fill="#fdf6ff">
    <circle class="twinkle" cx="80" cy="60" r="1.8"/>
    <circle class="twinkle b" cx="170" cy="120" r="1.4"/>
    <circle class="twinkle c" cx="240" cy="40" r="2.2"/>
    <circle class="twinkle" cx="330" cy="150" r="1.2"/>
    <circle class="twinkle b" cx="410" cy="80" r="1.8"/>
    <circle class="twinkle c" cx="470" cy="30" r="1.3"/>
    <circle class="twinkle" cx="540" cy="140" r="1.6"/>
    <circle class="twinkle b" cx="880" cy="60" r="2"/>
    <circle class="twinkle c" cx="920" cy="170" r="1.3"/>
    <circle class="twinkle" cx="820" cy="210" r="1.1"/>
    <circle class="twinkle b" cx="60" cy="200" r="1.2"/>
    <circle class="twinkle c" cx="130" cy="30" r="1"/>
    <circle class="twinkle" cx="300" cy="230" r="1"/>
    <circle class="twinkle b" cx="600" cy="60" r="1.1"/>
  </g>
  <circle cx="690" cy="150" r="150" fill="url(#moonGlow)"/>
  <circle cx="690" cy="150" r="88" fill="url(#moon)"/>
  <g fill="#6fb062" opacity="0.55">
    <circle cx="660" cy="125" r="14"/>
    <circle cx="712" cy="180" r="10"/>
    <circle cx="725" cy="120" r="7"/>
    <circle cx="650" cy="185" r="6"/>
  </g>
  <path d="M0 330 C 140 270, 260 290, 380 310 S 640 260, 760 290 S 900 300, 960 280 L 960 540 L 0 540 Z" fill="url(#hillFar)"/>
  <path d="M0 380 C 120 340, 230 350, 340 372 S 560 400, 700 352 S 880 330, 960 350 L 960 540 L 0 540 Z" fill="url(#hillMid)"/>
  <g fill="#0e1712">
    <ellipse cx="438" cy="372" rx="17" ry="11"/>
    <circle cx="459" cy="366" r="6"/>
    <rect x="474" y="356" width="44" height="18" rx="3"/>
    <rect x="482" y="344" width="10" height="14"/>
    <rect x="502" y="344" width="10" height="14"/>
    <circle cx="522" cy="365" r="7"/>
  </g>
  <path d="M0 440 C 150 400, 310 420, 460 446 S 760 470, 960 420 L 960 540 L 0 540 Z" fill="url(#hillNear)"/>
  <g stroke="#2d5a33" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M40 470 l -6 -26 M48 472 l 4 -30 M56 474 l 10 -22"/>
    <path d="M210 470 l -8 -22 M220 468 l 2 -30 M230 470 l 9 -24"/>
    <path d="M610 486 l -6 -24 M620 488 l 4 -28 M630 488 l 10 -20"/>
    <path d="M860 448 l -6 -22 M870 448 l 3 -28 M880 450 l 9 -22"/>
  </g>
  <g>
    <circle class="drift" cx="120" cy="410" r="9" fill="url(#fly)"/>
    <circle class="drift b" cx="260" cy="360" r="8" fill="url(#fly)"/>
    <circle class="drift c" cx="350" cy="430" r="10" fill="url(#fly)"/>
    <circle class="drift" cx="560" cy="380" r="7" fill="url(#fly)"/>
    <circle class="drift b" cx="640" cy="440" r="9" fill="url(#fly)"/>
    <circle class="drift c" cx="780" cy="390" r="8" fill="url(#fly)"/>
    <circle class="drift" cx="900" cy="470" r="9" fill="url(#fly)"/>
    <circle class="drift b" cx="470" cy="480" r="10" fill="url(#fly)"/>
    <circle class="drift c" cx="60" cy="500" r="8" fill="url(#fly)"/>
  </g>
</svg>
