<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A golden clockwork medallion in Oogrish's hand, with a glowing blue sphere beneath the cogs">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#3b2458"/>
      <stop offset="1" stop-color="#120a22"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa45a"/>
      <stop offset="1" stop-color="#4b6e35"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e3b53f"/>
      <stop offset="1" stop-color="#8a5f17"/>
    </radialGradient>
    <radialGradient id="face" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a1d10"/>
      <stop offset="1" stop-color="#4a3416"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#e6fbff"/>
      <stop offset="0.35" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#1a6fd1"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fdcff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fdcff" stop-opacity="0"/>
    </radialGradient>
    <g id="cog">
      <circle r="34" fill="none" stroke="#d9a63a" stroke-width="10" stroke-dasharray="9 7"/>
      <circle r="24" fill="#b88a2c" stroke="#f3d27a" stroke-width="3"/>
      <circle r="6" fill="#5c3f12"/>
    </g>
    <style>
      .spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      .spin.back { animation-direction: reverse; animation-duration: 6s; }
      .pulse { animation: pulse 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .hum { animation: hum 1.6s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity: 0.55; transform: scale(0.92); } to { opacity: 1; transform: scale(1.06); } }
      @keyframes hum { from { opacity: 0.2; } to { opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) { .spin, .pulse, .hum { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <g fill="#c9a6ff" opacity="0.18">
    <circle cx="140" cy="110" r="40"/>
    <circle cx="830" cy="90" r="56"/>
    <circle cx="880" cy="420" r="34"/>
    <circle cx="90" cy="430" r="28"/>
  </g>
  <path d="M250 540 C 260 470, 300 420, 360 400 L 610 400 C 670 420, 712 470, 722 540 Z" fill="url(#skin)" stroke="#3a5a28" stroke-width="4"/>
  <g fill="#3f5f2c" opacity="0.55">
    <circle cx="330" cy="480" r="12"/>
    <circle cx="372" cy="512" r="9"/>
    <circle cx="610" cy="470" r="11"/>
    <circle cx="650" cy="510" r="8"/>
    <circle cx="470" cy="500" r="10"/>
    <circle cx="540" cy="470" r="7"/>
  </g>
  <path d="M480 0 L 480 92" stroke="#b88a2c" stroke-width="8" stroke-dasharray="14 6"/>
  <circle cx="480" cy="116" r="22" fill="none" stroke="#d9a63a" stroke-width="9"/>
  <circle cx="480" cy="290" r="210" fill="url(#halo)"/>
  <circle cx="480" cy="290" r="158" fill="url(#gold)" stroke="#6e4a12" stroke-width="6"/>
  <circle cx="480" cy="290" r="132" fill="url(#face)" stroke="#f3d27a" stroke-width="4"/>
  <g stroke="#f3d27a" stroke-width="4" stroke-linecap="round">
    <path d="M480 166 v 16 M480 398 v 16 M356 290 h 16 M588 290 h 16"/>
    <path d="M392 202 l 11 11 M568 202 l -11 11 M392 378 l 11 -11 M568 378 l -11 -11"/>
  </g>
  <circle class="pulse" cx="480" cy="312" r="58" fill="url(#halo)"/>
  <circle cx="480" cy="312" r="30" fill="url(#sphere)" stroke="#bff0ff" stroke-width="2"/>
  <circle cx="470" cy="302" r="8" fill="#ffffff" opacity="0.8"/>
  <g transform="translate(430 240)"><g class="spin"><use href="#cog"/></g></g>
  <g transform="translate(540 252) scale(0.75)"><g class="spin back"><use href="#cog"/></g></g>
  <g transform="translate(486 214) scale(0.5)"><g class="spin"><use href="#cog"/></g></g>
  <g transform="translate(410 330) scale(0.55)"><g class="spin back"><use href="#cog"/></g></g>
  <g transform="translate(556 344) scale(0.6)"><g class="spin"><use href="#cog"/></g></g>
  <g fill="url(#skin)" stroke="#3a5a28" stroke-width="4">
    <path d="M330 420 C 300 380, 300 330, 322 300 C 340 286, 362 296, 362 318 C 360 350, 366 380, 380 410 Z"/>
    <rect x="392" y="388" width="56" height="88" rx="26"/>
    <rect x="456" y="398" width="56" height="88" rx="26"/>
    <rect x="520" y="388" width="56" height="88" rx="26"/>
    <rect x="584" y="372" width="50" height="80" rx="24"/>
  </g>
  <g fill="#e9e1c8" opacity="0.85">
    <path d="M404 398 q 16 -10 32 0 q -16 6 -32 0 Z"/>
    <path d="M468 408 q 16 -10 32 0 q -16 6 -32 0 Z"/>
    <path d="M532 398 q 16 -10 32 0 q -16 6 -32 0 Z"/>
    <path d="M594 382 q 15 -9 30 0 q -15 6 -30 0 Z"/>
    <path d="M318 304 q 14 -8 30 2 q -16 4 -30 -2 Z"/>
  </g>
  <g class="hum" fill="none" stroke="#8fdcff" stroke-width="4" stroke-linecap="round">
    <path d="M250 230 q -24 60 0 120"/>
    <path d="M214 210 q -36 80 0 160"/>
    <path d="M710 230 q 24 60 0 120"/>
    <path d="M746 210 q 36 80 0 160"/>
  </g>
</svg>
