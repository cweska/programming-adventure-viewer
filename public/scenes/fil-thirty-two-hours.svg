    <style>
      .flame { animation: flame 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .flame.b { animation-duration: 1.2s; animation-delay: -0.4s; }
      .flame.c { animation-duration: 0.7s; animation-delay: -0.2s; }
      @keyframes flame { from { transform: scale(0.9, 0.85); opacity: 0.85; } to { transform: scale(1.05, 1.12); opacity: 1; } }
      .glow { animation: glow 1.8s ease-in-out infinite alternate; }
      .pendulum { animation: swing 2.4s ease-in-out infinite alternate; transform-origin: 640px 186px; }
      @keyframes glow { from { opacity: 0.7; } to { opacity: 1; } }
      @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
      .clockpulse { animation: glow 2.4s ease-in-out infinite alternate; }
      .dim { opacity: 0.55; }
      .zz { animation: zz 3.2s ease-in-out infinite; }
      .zz.b { animation-delay: -1.6s; }
      @keyframes zz { from { opacity: 0; transform: translateY(6px); } 40% { opacity: 0.9; } to { opacity: 0; transform: translateY(-14px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
