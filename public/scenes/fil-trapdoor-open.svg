    <style>
      .mote { animation: mote 6s ease-in-out infinite alternate; }
      .mote.b { animation-duration: 7.4s; animation-delay: -2s; }
      .mote.c { animation-duration: 5.2s; animation-delay: -3.6s; }
      .beam { animation: beam 3.2s ease-in-out infinite alternate; }
      @keyframes mote { from { transform: translate(0, 0); opacity: 0.25; } to { transform: translate(14px, -26px); opacity: 0.9; } }
      @keyframes beam { from { opacity: 0.75; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .mote, .beam { animation: none; } }
