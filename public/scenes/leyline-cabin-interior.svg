<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Inside Mar'tu's cabin: a fire in a stone fireplace, a pendulum clock glowing blue on the mantle, and Mar'tu at the table in a purple shroud">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#5a3a22"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6773f"/>
      <stop offset="1" stop-color="#7a5229"/>
    </linearGradient>
    <linearGradient id="cherry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a1442e"/>
      <stop offset="1" stop-color="#6b2618"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c8a86"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fe6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2f9be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.4" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#1a6fd1"/>
    </radialGradient>
    <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c4a86"/>
      <stop offset="1" stop-color="#3e2850"/>
    </linearGradient>
    <style>
      .flame { animation: flame 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .flame.b { animation-duration: 1.2s; animation-delay: -0.4s; }
      .flame.c { animation-duration: 0.7s; animation-delay: -0.2s; }
      .glow { animation: glow 1.8s ease-in-out infinite alternate; }
      .pendulum { animation: swing 2.4s ease-in-out infinite alternate; transform-origin: 640px 196px; }
      .pulse { animation: pulse 2.4s ease-in-out infinite alternate; }
      @keyframes flame { from { transform: scale(0.9, 0.85); opacity: 0.85; } to { transform: scale(1.05, 1.12); opacity: 1; } }
      @keyframes glow { from { opacity: 0.7; } to { opacity: 1; } }
      @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
      @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flame, .glow, .pendulum, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#wall)"/>
  <g stroke="#2a190d" stroke-width="3" opacity="0.55">
    <path d="M0 60 H960 M0 120 H960 M0 180 H960 M0 240 H960 M0 300 H960 M0 360 H960"/>
  </g>
  <path d="M0 380 L960 380 L960 540 L0 540 Z" fill="url(#floor)"/>
  <g stroke="#3a2416" stroke-width="2" opacity="0.6">
    <path d="M0 410 H960 M0 446 H960 M0 488 H960"/>
    <path d="M120 380 L80 540 M300 380 L280 540 M480 380 L480 540 M660 380 L680 540 M840 380 L880 540"/>
  </g>

  <g>
