    <path d="M800 432 H930" stroke="#3a2416" stroke-width="3"/>
    <path d="M826 408 V488 M904 408 V488" stroke="#5c5c66" stroke-width="6"/>
    <rect x="856" y="426" width="18" height="16" rx="2" fill="#c9a24a" stroke="#6e4a12" stroke-width="2"/>
  </g>
</svg>
