<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A close-up of Mar&#x27;tu with wide yellow eyes as the word Knock appears again and again">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a170c"/>
      <stop offset="1" stop-color="#4a2c6a"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.1" cy="0.8" r="0.8">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5594"/>
      <stop offset="0.6" stop-color="#553a6c"/>
      <stop offset="1" stop-color="#3a2650"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.6" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#e09a12"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd23a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .knock { opacity: 0; animation: knock 4.2s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .knock.k2 { animation-delay: 0.3s; }
      .knock.k3 { animation-delay: 0.6s; }
      @keyframes knock {
        0% { opacity: 0; transform: scale(0.5); }
        4% { opacity: 1; transform: scale(1.15); }
        8% { opacity: 1; transform: scale(1); }
        80% { opacity: 0; transform: scale(1); }
        100% { opacity: 0; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) { .knock { animation: none; opacity: 1; } }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#fire)"/>
  <rect x="760" y="60" width="160" height="220" fill="#1a1230" stroke="#2a190d" stroke-width="10"/>
  <circle cx="860" cy="120" r="22" fill="#b8f5a0" opacity="0.8"/>
  <path d="M840 60 V280 M760 170 H920" stroke="#2a190d" stroke-width="7"/>
  <path d="M120 540 C 110 360, 180 120, 420 70 C 640 30, 790 200, 780 380 C 776 450, 760 500, 740 540 Z" fill="url(#hood)" stroke="#24162e" stroke-width="6"/>
  <path d="M250 540 C 250 390, 300 230, 450 196 C 590 170, 680 270, 672 400 C 668 460, 650 510, 636 540 Z" fill="#120a18"/>
  <path d="M420 70 C 470 120, 500 150, 560 160" fill="none" stroke="#9a77b4" stroke-width="8" opacity="0.5"/>
  <circle cx="400" cy="330" r="82" fill="url(#eyeGlow)"/>
  <circle cx="560" cy="330" r="82" fill="url(#eyeGlow)"/>
  <ellipse cx="400" cy="330" rx="44" ry="36" fill="url(#eye)"/>
  <ellipse cx="560" cy="330" rx="44" ry="36" fill="url(#eye)"/>
  <circle cx="404" cy="340" r="9" fill="#3a2006"/>
  <circle cx="564" cy="340" r="9" fill="#3a2006"/>
  <circle cx="407" cy="336" r="2.5" fill="#fff6d0"/>
  <circle cx="567" cy="336" r="2.5" fill="#fff6d0"/>
  <path d="M352 276 Q 400 252 448 274" fill="none" stroke="#0a0610" stroke-width="6" stroke-linecap="round"/>
  <path d="M512 274 Q 560 252 608 276" fill="none" stroke="#0a0610" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(720 330)">
    <g class="knock k1">
      <path d="M97.1 8.6 L133.5 11.8 M68.5 35.4 L94.1 48.7 M13.7 48.8 L18.9 67.1 M-46.3 43.5 L-63.6 59.8 M-88.6 21.6 L-121.8 29.7 M-97.1 -8.6 L-133.5 -11.8 M-68.5 -35.4 L-94.1 -48.7 M-13.7 -48.8 L-18.9 -67.1 M46.3 -43.5 L63.6 -59.8 M88.6 -21.6 L121.8 -29.7" stroke="#fff3b0" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="15" transform="rotate(-8 0 0)" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="44" fill="#ffe14a" stroke="#2a1606" stroke-width="7" stroke-linejoin="round" paint-order="stroke">KNOCK</text>
    </g>
    <g class="knock k2">
      <path d="M180.3 81.7 L221.7 85.4 M147.8 112.3 L177.0 127.4 M85.6 127.5 L91.4 148.3 M17.4 121.4 L-2.3 140.0 M-30.7 96.5 L-68.4 105.8 M-40.3 62.3 L-81.7 58.6 M-7.8 31.7 L-37.0 16.6 M54.4 16.5 L48.6 -4.3 M122.6 22.6 L142.3 4.0 M170.7 47.5 L208.4 38.2" stroke="#fff3b0" stroke-width="4" stroke-linecap="round"/>
      <text x="70" y="90" transform="rotate(6 70 72)" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="50" fill="#ffe14a" stroke="#2a1606" stroke-width="7" stroke-linejoin="round" paint-order="stroke">KNOCK</text>
    </g>
    <g class="knock k3">
      <path d="M113.5 160.9 L159.9 165.0 M77.1 195.1 L109.8 212.0 M7.5 212.1 L14.0 235.4 M-68.9 205.4 L-91.0 226.1 M-122.7 177.5 L-165.0 187.8 M-133.5 139.1 L-179.9 135.0 M-97.1 104.9 L-129.8 88.0 M-27.5 87.9 L-34.0 64.6 M48.9 94.6 L71.0 73.9 M102.7 122.5 L145.0 112.2" stroke="#fff3b0" stroke-width="4" stroke-linecap="round"/>
      <text x="-10" y="170" transform="rotate(-4 -10 150)" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="56" fill="#ffe14a" stroke="#2a1606" stroke-width="7" stroke-linejoin="round" paint-order="stroke">KNOCK</text>
    </g>
  </g>
</svg>
