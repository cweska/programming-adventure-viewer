    <radialGradient id="warm" cx="0.2" cy="0.6" r="0.9">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fe6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2f9be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.4" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#1a6fd1"/>
    </radialGradient>
    <radialGradient id="redSphere" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffe2dc"/>
      <stop offset="0.4" stop-color="#ff5a46"/>
      <stop offset="1" stop-color="#a3120c"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a50" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d0201a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flame { animation: flame 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .flame.b { animation-duration: 1.2s; animation-delay: -0.4s; }
      .flame.c { animation-duration: 0.7s; animation-delay: -0.2s; }
      @keyframes flame { from { transform: scale(0.9, 0.85); opacity: 0.85; } to { transform: scale(1.05, 1.12); opacity: 1; } }
      .glow { animation: glow 1.8s ease-in-out infinite alternate; }
      .pendulum { animation: swing 2.4s ease-in-out infinite alternate; transform-origin: 640px 186px; }
      @keyframes glow { from { opacity: 0.7; } to { opacity: 1; } }
      @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
      .clockpulse, .flash { animation: flash 2s ease-in-out infinite; }
      .wash { opacity: 0.12; animation: wash 2s ease-in-out infinite; }
      .buzz { animation: buzz 0.18s linear infinite alternate; }
      .hum { animation: flash 0.6s ease-in-out infinite alternate; }
      @keyframes flash { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes wash { 0%, 100% { opacity: 0.04; } 50% { opacity: 0.3; } }
      @keyframes buzz { from { transform: translate(-1.5px, 0); } to { transform: translate(1.5px, 0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .wash { opacity: 0.18; } }
    </style>
  </defs>

