<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A close-up of the Ley Clock, its single hand at the edge of the glowing blue arc, with Mar&#x27;tu&#x27;s shrouded hand resting on top">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#5a3a22"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6773f"/>
      <stop offset="1" stop-color="#7a5229"/>
    </linearGradient>
    <linearGradient id="cherry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a1442e"/>
      <stop offset="1" stop-color="#6b2618"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c8a86"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160c32"/>
      <stop offset="1" stop-color="#4a2c6a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9aa8"/>
      <stop offset="1" stop-color="#b8c4d0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.5" stop-color="#c9d0d8"/>
      <stop offset="1" stop-color="#8e98a4"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8602c"/>
      <stop offset="1" stop-color="#8a4420"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="1" y2="0">
