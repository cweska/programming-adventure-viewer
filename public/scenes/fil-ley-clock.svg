    <path d="M606 140 Q 640 104 674 140" fill="#5a2a18" stroke="#c9a24a" stroke-width="3"/>
    <circle cx="640" cy="152" r="26" fill="#efe6d2" stroke="#c9a24a" stroke-width="3"/>
    <path class="clockpulse" d="M617.5 139 A 26 26 0 0 1 662.5 139" fill="none" stroke="#6fd3ff" stroke-width="6" stroke-linecap="round"/>
    <path class="clockpulse" d="M617.5 139 A 26 26 0 0 1 662.5 139" fill="none" stroke="#bff0ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M640 152 L622.2 142.9" stroke="#2a1d10" stroke-width="3" stroke-linecap="round"/>
    <circle cx="640" cy="152" r="3" fill="#2a1d10"/>
    <rect x="618" y="182" width="44" height="50" rx="4" fill="#2a160c" stroke="#c9a24a" stroke-width="2"/>
    <g class="pendulum">
      <path d="M640 186 V218" stroke="#c9a24a" stroke-width="2"/>
      <circle cx="640" cy="222" r="14" fill="url(#blueGlow)" class="clockpulse"/>
      <circle cx="640" cy="222" r="7" fill="url(#sphere)"/>
    </g>
  </g>
  <g>
    <path d="M980 -20 L 980 150 C 880 140, 740 118, 640 104 L 600 44 C 700 30, 850 6, 980 -20 Z" fill="url(#shroud)" stroke="#24162e" stroke-width="5"/>
    <path d="M960 30 C 860 44, 760 60, 660 70 M960 92 C 870 96, 760 92, 668 92" fill="none" stroke="#24162e" stroke-width="4" opacity="0.6"/>
    <path d="M940 4 C 840 22, 740 36, 640 50" fill="none" stroke="#9a77b4" stroke-width="5" opacity="0.5"/>
    <path d="M664 40 C 620 22, 556 26, 528 50 C 504 72, 512 100, 540 110 C 566 120, 612 116, 640 104 C 666 92, 680 60, 664 40 Z" fill="url(#shroud)" stroke="#24162e" stroke-width="5"/>
    <path d="M540 62 C 560 54, 590 54, 614 64 M532 84 C 556 78, 596 80, 626 90 M548 104 C 566 100, 596 102, 618 106" fill="none" stroke="#24162e" stroke-width="3.5" opacity="0.7"/>
    <path d="M560 46 C 584 36, 620 36, 646 48" fill="none" stroke="#9a77b4" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
