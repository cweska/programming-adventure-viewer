  <rect width="960" height="540" fill="url(#stone)"/>
  <g fill="none" stroke="#4a4744" stroke-width="4">
    <path d="M0 90 H960 M0 190 H960 M0 290 H960 M0 390 H960"/>
    <path d="M120 0 V90 M380 0 V90 M700 0 V90 M240 90 V190 M560 90 V190 M860 90 V190 M120 190 V290 M820 190 V290 M300 290 V390 M680 290 V390"/>
