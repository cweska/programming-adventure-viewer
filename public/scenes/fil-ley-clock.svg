  <circle class="glow" cx="480" cy="560" r="420" fill="url(#fireGlow)"/>
  <rect x="0" y="452" width="960" height="60" rx="6" fill="url(#cherry)" stroke="#4a1a10" stroke-width="5"/>
  <rect x="0" y="508" width="960" height="40" fill="#3a3836"/>
  <g transform="translate(480 30) scale(3.6) translate(-640 -110)">
